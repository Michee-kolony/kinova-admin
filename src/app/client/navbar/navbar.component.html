<!-- Navbar fixée en haut -->
<nav class="fixed top-0 left-0 right-0 z-50 bg-black border-b border-gray-800">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      
      <!-- Logo et nom Kinova -->
      <div class="flex items-center space-x-3">
        <div class="flex-shrink-0">
          <!-- Placeholder pour le logo -->
          <div class="w-10 h-10  rounded-lg flex items-center justify-center">
           <img src="images/icone-Photoroom.png"/>
          </div>
        </div>
        <div class="text-white font-bold text-2xl tracking-tight">
          <span class="text-white bg-clip-text text-transparent">
            Kinova
          </span>
        </div>
      </div>

      <!-- Navigation - Desktop -->
      <div class="hidden md:flex items-center space-x-8">
        <a routerLink="/" class="text-gray-300 hover:text-white text-decoration-none hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
          Accueil
        </a>
         <a routerLink="/kinova/decouvrir" class="text-gray-300 hover:text-white text-decoration-none hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
          Découvrir Kinova
        </a>
        <a routerLink="/kinova/support" class="text-gray-300 hover:text-white text-decoration-none hover:bg-gray-800 px-3 py-2 rounded-md text-sm font-medium transition-colors duration-200">
          Support
        </a>
      </div>

      <!-- Bouton menu mobile -->
      <div class="md:hidden">
        <button (click)="toggleMenu()" 
                class="text-gray-400 hover:text-white hover:bg-gray-800 p-2 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500 transition-colors duration-200">
          <svg class="h-6 w-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path *ngIf="!isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            <path *ngIf="isMenuOpen" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <!-- Menu mobile -->
  <div *ngIf="isMenuOpen" 
       class="md:hidden bg-black border-t border-gray-800 animate-slideDown">
    <div class="px-2 pt-2 pb-3 space-y-1">
      <a routerLink="/" class="block text-gray-300 text-decoration-none hover:text-white hover:bg-gray-800 px-3 py-2 rounded-md text-base font-medium transition-colors duration-200">
        Accueil
      </a>
       <a routerLink="/kinova/decouvrir" class="block text-gray-300 text-decoration-none hover:text-white hover:bg-gray-800 px-3 py-2 rounded-md text-base font-medium transition-colors duration-200">
        Découvrir Kinova
      </a>
      <a routerLink="/kinova/support" class="block text-gray-300 text-decoration-none hover:text-white hover:bg-gray-800 px-3 py-2 rounded-md text-base font-medium transition-colors duration-200">
        Support
      </a>
    </div>
  </div>
</nav>

<!-- Espace pour le contenu (pour éviter que le contenu soit caché sous la navbar) -->
<div class="h-16"></div>
