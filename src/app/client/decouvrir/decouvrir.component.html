<div class="bg-black text-white font-sans overflow-x-hidden">

  <!-- Hero Section: Découvrir Kinova avec fond jaune dégradé et cercles animés -->
  <section class="relative bg-gradient-to-br from-yellow-400 via-yellow-300 to-yellow-500 py-24 px-6 overflow-hidden">
     <!-- Texture animée - Cercles flottants -->
        <div class="absolute inset-0 overflow-hidden">
          <div class="absolute -top-20 -right-20 w-64 sm:w-96 h-64 sm:h-96 bg-yellow-300 rounded-full opacity-20 animate-pulse"></div>
          <div class="absolute top-1/2 -left-20 w-56 sm:w-80 h-56 sm:h-80 bg-amber-400 rounded-full opacity-20 animate-bounce"></div>
          <div class="absolute bottom-0 right-1/4 w-48 sm:w-64 h-48 sm:h-64 bg-yellow-200 rounded-full opacity-30 animate-pulse"></div>
          <div class="absolute top-1/3 right-1/3 w-36 sm:w-48 h-36 sm:h-48 bg-amber-300 rounded-full opacity-25 animate-ping"></div>
          <!-- Lignes décoratives -->
          <div class="absolute top-0 left-0 w-full h-full">
            <div class="absolute top-10 left-10 w-24 sm:w-32 h-24 sm:h-32 border-2 border-yellow-200/30 rounded-full animate-spin-slow"></div>
            <div class="absolute bottom-10 right-10 w-32 sm:w-40 h-32 sm:h-40 border-2 border-yellow-200/30 rounded-full animate-spin-slow-reverse"></div>
          </div>
        </div>

    <div class="relative z-10 max-w-6xl mx-auto text-center">
      <div class="inline-block bg-black text-yellow-400 text-sm font-bold uppercase tracking-widest px-4 py-1 rounded-full mb-4 shadow-lg">Guide de l'application</div>
      <h1 class="text-5xl md:text-7xl font-extrabold tracking-tight text-white">
        <span class="text-black">Découvrir</span><br/><span class="text-white">Kinova</span>
      </h1>
      <p class="text-lg md:text-xl text-black/80 max-w-2xl mx-auto mt-6 leading-relaxed font-medium">
        Toutes les pages de l'application mobile, expliquées pas à pas, pour acheter ou vendre en toute simplicité.
      </p>

      <!-- Sommaire -->
      <nav class="mt-10 flex flex-wrap justify-center gap-3">
        <button *ngFor="let section of sections" type="button" (click)="allerA(section.id)"
                class="bg-black/90 hover:bg-black text-white text-sm font-semibold px-5 py-2.5 rounded-full shadow-lg transition">
          {{ section.titre }}
        </button>
      </nav>
    </div>
    <div class="absolute bottom-0 left-0 w-full h-2 bg-black/30"></div>
  </section>

  <!-- Sections du guide -->
  <section *ngFor="let section of sections; let s = index" [id]="section.id" class="py-20 px-6 scroll-mt-20"
           [class.bg-gradient-to-b]="section.vendeur" [class.from-gray-900]="section.vendeur" [class.to-black]="section.vendeur">
    <div class="max-w-6xl mx-auto">

      <div class="text-center max-w-2xl mx-auto mb-14">
        <span class="inline-block text-xs font-bold uppercase tracking-widest px-3 py-1 rounded-full"
              [ngClass]="section.vendeur ? 'bg-yellow-500 text-black' : 'bg-yellow-400/10 text-yellow-400 border border-yellow-400/30'">
          {{ section.badge }}
        </span>
        <h2 class="text-3xl md:text-5xl font-bold text-white mt-4">
          <span class="text-yellow-400">{{ s + 1 }}.</span> {{ section.titre }}
        </h2>
        <p class="text-gray-400 mt-4 text-base md:text-lg leading-relaxed">{{ section.intro }}</p>
      </div>

      <div class="grid sm:grid-cols-2 gap-x-8 gap-y-14"
           [ngClass]="section.ecrans.length === 4 ? 'lg:grid-cols-4' : 'lg:grid-cols-3'">
        <div *ngFor="let ecran of section.ecrans; let i = index" class="group flex flex-col items-center text-center">

          <!-- Cadre téléphone -->
          <div class="phone relative w-[220px] rounded-[2.6rem] bg-gray-950 p-[9px] ring-1 ring-white/10 transition duration-300 group-hover:-translate-y-2">
            <div class="rounded-[2.1rem] overflow-hidden bg-white aspect-[390/844]">
              <img [src]="'images/app/' + ecran.image + '.webp'" [alt]="'Kinova — ' + ecran.titre"
                   loading="lazy" class="w-full h-full object-cover object-top">
            </div>
          </div>

          <div class="mt-6 max-w-xs">
            <div class="flex items-center justify-center gap-2">
              <span class="flex items-center justify-center w-7 h-7 rounded-full bg-yellow-400 text-black text-sm font-black">{{ i + 1 }}</span>
              <h3 class="text-lg font-semibold text-white">{{ ecran.titre }}</h3>
            </div>
            <p class="text-gray-400 text-sm mt-2 leading-relaxed">{{ ecran.description }}</p>
          </div>
        </div>
      </div>

    </div>
  </section>

</div>
