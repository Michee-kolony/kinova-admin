<!-- admin.component.html -->
<div class="admin-container">
  <!-- OVERLAY MOBILE -->
  <div
    *ngIf="sidebarOpen"
    (click)="closeSidebar()"
    class="sidebar-overlay"
    [class.active]="sidebarOpen">
  </div>

  <!-- SIDEBAR -->
  <aside 
    class="sidebar"
    [class.open]="sidebarOpen"
    [class.dark]="themeService.isDark()">
    
    <div class="sidebar-inner">
      <!-- HEADER -->
      <div class="sidebar-header">
        <div class="logo-container">
          <div class="logo-icon">
            <img src="images/icone-Photoroom.png"/>
          </div>
          <span class="logo-text">KIN<span>NOVA</span></span>
        </div>
        
        <button 
          class="close-btn mobile-only"
          (click)="closeSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 6L6 18M6 6l12 12"/>
          </svg>
        </button>
      </div>
   
      <!-- USER PROFILE -->
<div class="flex container items-center gap-3">

  <!-- Avatar -->
  <div
    class="relative flex h-12 w-12 items-center justify-center rounded-full
           bg-gradient-to-br from-yellow-300 via-yellow-400 to-amber-500
           text-lg font-bold text-white shadow-lg">
    A

    <!-- Statut en ligne -->
    <span
      class="absolute bottom-0 right-0 h-3.5 w-3.5 rounded-full
             border-2 border-white dark:border-zinc-900 bg-green-500">
    </span>
  </div>

  <!-- Informations -->
  <div class="mt-4">
    <h4 class="font-semibold text-sm text-gray-900 dark:text-white">
      Administrateur
    </h4>

    <p class="text-sm text-gray-500 dark:text-gray-400">
      adminexemple.com
    </p>
  </div>

</div>

      <!-- NAVIGATION -->
      <nav class="sidebar-nav">
        <div class="nav-section">
          <span class="nav-label">Menu Principal</span>
     <a 
  routerLink="/admin/dashboard"
  (click)="closeSidebar()"
  routerLinkActive="active"
  class="nav-item">
  <span class="nav-icon">
    <i class="fas fa-chart-pie"></i>
  </span>
  <span class="nav-text">Dashboard</span>
</a>
        <a 
  routerLink="/admin/commandes"
  (click)="closeSidebar()"
  routerLinkActive="active"
  class="nav-item">
  <span class="nav-icon">
    <i class="fas fa-shopping-cart"></i>
  </span>
  <span class="nav-text">Commandes</span>
</a>

  <a 
  routerLink="/admin/mesarticles"
  (click)="closeSidebar()"
  routerLinkActive="active"
  class="nav-item">
  <span class="nav-icon">
    <i class="fas fa-newspaper"></i>
  </span>
  <span class="nav-text">Mes Articles</span>
</a>




        </div>

        <div class="nav-section">
          <span class="nav-label">Autres</span>
              
                <a 
        routerLink="/admin/clientlist"
        (click)="closeSidebar()"
        routerLinkActive="active"
        class="nav-item">
        <span class="nav-icon">
          <i class="fas fa-users"></i>
        </span>
        <span class="nav-text">Liste des Clients</span>
      </a>

  
      <a 
        routerLink="/admin/vendeurlist"
        (click)="closeSidebar()"
        routerLinkActive="active"
        class="nav-item">
        <span class="nav-icon">
          <i class="fas fa-users"></i>
        </span>
        <span class="nav-text">Liste des Vendeurs</span>
      </a>
          

  <a 
        routerLink="/admin/settings"
        (click)="closeSidebar()"
        routerLinkActive="active"
        class="nav-item">
        <span class="nav-icon">
          <i class="fas fa-gear"></i>
        </span>
        <span class="nav-text">Administrateurs</span>
      </a>

         <button 
        (click)="toggleTheme()"
        class="theme-toggle">
        <span class="toggle-icon">
          <svg *ngIf="!themeService.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg *ngIf="themeService.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </span>
        <span class="toggle-text">
          {{ themeService.isDark() ? 'Mode Clair' : 'Mode Sombre' }}
        </span>
      </button>    

        </div>
      </nav>
    </div>
  </aside>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <!-- TOP BAR -->
    <header class="topbar">
      <div class="topbar-left">
        <button 
          class="menu-btn mobile-only"
          (click)="toggleSidebar()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
        </button>      
     
      </div>

      <div class="topbar-right">
        <button class="icon-btn" title="Notifications">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <span class="notification-dot"></span>
        </button>
        
        <button class="icon-btn mobile-hidden" (click)="toggleTheme()">
          <svg *ngIf="!themeService.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          <svg *ngIf="themeService.isDark()" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="5"/>
            <line x1="12" y1="1" x2="12" y2="3"/>
            <line x1="12" y1="21" x2="12" y2="23"/>
            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
            <line x1="1" y1="12" x2="3" y2="12"/>
            <line x1="21" y1="12" x2="23" y2="12"/>
            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
          </svg>
        </button>
      </div>
    </header>

    <!-- PAGE CONTENT -->
    <main class="page-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
