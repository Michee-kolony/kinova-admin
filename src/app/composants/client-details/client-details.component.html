<div class="min-h-screen p-4 md:p-8 bg-gray-50 dark:bg-black">
  <!-- Chargement -->
  <div *ngIf="loading" class="flex justify-center items-center h-96">
    <div class="relative">
      <div class="w-16 h-16 rounded-full border-4 border-yellow-500 border-t-transparent animate-spin"></div>
      <div class="absolute inset-0 flex items-center justify-center">
        <div class="w-8 h-8 rounded-full bg-yellow-500 animate-pulse"></div>
      </div>
    </div>
  </div>

  <!-- Carte -->
  <div *ngIf="!loading && client" class="max-w-4xl mx-auto">
    <!-- En-tête avec gradient amélioré -->
    <div class="relative overflow-hidden bg-gradient-to-br from-yellow-600 via-yellow-500 to-yellow-400 rounded-t-3xl p-8 text-center">
      <!-- Effet de fond décoratif -->
      <div class="absolute -top-24 -right-24 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
      <div class="absolute -bottom-24 -left-24 w-64 h-64 bg-white/10 rounded-full blur-3xl"></div>
      
      <div class="relative z-10">
        <div class="w-28 h-28 rounded-full bg-white/20 backdrop-blur-sm border-4 border-white/50 flex items-center justify-center mx-auto shadow-2xl">
          <span class="text-5xl font-bold text-white">
            {{client.name.charAt(0)}}
          </span>
        </div>
        
        <h2 class="mt-5 text-4xl font-bold text-white drop-shadow-lg">
          {{client.name}}
        </h2>
        <p class="text-yellow-100 font-medium mt-1">
          <span class="inline-flex items-center gap-2">
            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20">
              <path d="M10 2a8 8 0 100 16 8 8 0 000-16zm0 14a6 6 0 110-12 6 6 0 010 12z"/>
              <path d="M10 6a1 1 0 00-1 1v3a1 1 0 001 1h2a1 1 0 100-2h-1V7a1 1 0 00-1-1z"/>
            </svg>
            Client Kinova
          </span>
        </p>
      </div>
    </div>

    <!-- Tableau des informations -->
    <div class="bg-gray-50 dark:bg-black rounded-b-3xl shadow-2xl overflow-hidden">
      <div class="overflow-x-auto">
        <table class="w-full">
          <thead>
            <tr class="bg-gray-50 dark:bg-gray-700/50 border-b border-gray-200 dark:border-gray-700">
              <th class="px-6 py-4 text-left text-sm font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider">
                Informations
              </th>
              <th class="px-6 py-4 text-right text-sm font-semibold text-gray-600 dark:text-gray-300 uppercase tracking-wider">
                Détails
              </th>
            </tr>
          </thead>
          <tbody class="divide-y divide-gray-200 dark:divide-gray-700">
            <!-- Email -->
            <tr class="hover:bg-yellow-50 dark:hover:bg-yellow-900/20 transition-colors duration-200">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-yellow-600 dark:text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                  </div>
                  <span class="font-medium text-gray-700 dark:text-gray-300">Email</span>
                </div>
              </td>
              <td class="px-6 py-4 text-right">
                <span class="text-gray-900 dark:text-white font-mono text-sm">
                  {{client.email}}
                </span>
              </td>
            </tr>

            <!-- Téléphone -->
            <tr class="hover:bg-yellow-50 dark:hover:bg-yellow-900/20 transition-colors duration-200">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-yellow-600 dark:text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5a2 2 0 012-2h3.28a1 1 0 01.948.684l1.498 4.493a1 1 0 01-.502 1.21l-2.257 1.13a11.042 11.042 0 005.516 5.516l1.13-2.257a1 1 0 011.21-.502l4.493 1.498a1 1 0 01.684.949V19a2 2 0 01-2 2h-1C9.716 21 3 14.284 3 6V5z"/>
                    </svg>
                  </div>
                  <span class="font-medium text-gray-700 dark:text-gray-300">Téléphone</span>
                </div>
              </td>
              <td class="px-6 py-4 text-right">
                <span class="text-gray-900 dark:text-white font-medium">
                  {{client.telephone}}
                </span>
              </td>
            </tr>

            <!-- Genre -->
            <tr class="hover:bg-yellow-50 dark:hover:bg-yellow-900/20 transition-colors duration-200">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-yellow-600 dark:text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                    </svg>
                  </div>
                  <span class="font-medium text-gray-700 dark:text-gray-300">Genre</span>
                </div>
              </td>
              <td class="px-6 py-4 text-right">
                <span class="inline-flex items-center gap-2 px-3 py-1 rounded-full text-sm font-medium bg-yellow-100 dark:bg-yellow-900/30 text-yellow-700 dark:text-yellow-300">
                  {{client.genre}}
                </span>
              </td>
            </tr>

            <!-- Inscription -->
            <tr class="hover:bg-yellow-50 dark:hover:bg-yellow-900/20 transition-colors duration-200">
              <td class="px-6 py-4">
                <div class="flex items-center gap-3">
                  <div class="w-10 h-10 rounded-xl bg-yellow-100 dark:bg-yellow-900/30 flex items-center justify-center flex-shrink-0">
                    <svg class="w-5 h-5 text-yellow-600 dark:text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                  </div>
                  <span class="font-medium text-gray-700 dark:text-gray-300">Inscription</span>
                </div>
              </td>
              <td class="px-6 py-4 text-right">
                <span class="text-gray-900 dark:text-white font-medium">
                  {{client.date}}
                </span>
              </td>
            </tr>
          </tbody>
        </table>
      </div>

      <!-- Boutons d'action -->
      <div class="px-6 py-5 bg-gray-50 dark:bg-gray-700/30 border-t border-gray-200 dark:border-gray-700 flex flex-col sm:flex-row justify-end gap-3">
        <button
          routerLink="/admin/clientlist"
          class="px-6 py-3 rounded-xl font-medium text-gray-700 dark:text-gray-200 hover:bg-gray-200 dark:hover:bg-gray-600 transition-colors duration-200 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
          </svg>
          Retour
        </button>
        
        <button
          (click)="openModal()"
          class="px-6 py-3 rounded-xl bg-gradient-to-r from-red-600 to-red-700 hover:from-red-700 hover:to-red-800 text-white font-medium shadow-lg hover:shadow-xl transform hover:-translate-y-0.5 transition-all duration-200 flex items-center justify-center gap-2">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
          </svg>
          Supprimer
        </button>
      </div>
    </div>
  </div>
</div>

<!-- Modal amélioré -->
<div
  *ngIf="showModal"
  class="fixed inset-0 bg-black/60 backdrop-blur-sm flex justify-center items-center z-50 animate-fade-in">
  
  <div class="bg-gray-50 dark:bg-gray-800 rounded-3xl w-[440px] max-w-[95%] p-8 shadow-2xl transform animate-slide-up">
    <div class="text-center">
      
      <h2 class="mt-6 text-2xl font-bold text-gray-900 dark:text-white">
        Supprimer ce client ?
      </h2>
      
      <div class="mt-3 space-y-2">
        <p class="text-gray-500 dark:text-gray-400">
          Cette action est irréversible.
        </p>
        <p class="font-semibold text-gray-700 dark:text-gray-300 text-lg">
          "{{client.name}}"
        </p>
      </div>
    </div>

    <div class="flex flex-col sm:flex-row justify-center gap-3 mt-8">
      <button
        (click)="closeModal()"
        class="px-6 py-3 rounded-xl bg-gray-100 dark:bg-gray-700 hover:bg-gray-200 dark:hover:bg-gray-600 text-gray-700 dark:text-gray-200 font-medium transition-colors duration-200 order-2 sm:order-1">
        Annuler
      </button>
      
      <button
        (click)="deleteClient()"
        [disabled]="deleting"
        class="px-6 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-medium shadow-lg hover:shadow-xl disabled:opacity-50 disabled:cursor-not-allowed transition-all duration-200 order-1 sm:order-2 flex items-center justify-center gap-2">
        <span *ngIf="!deleting">Oui, supprimer</span>
        <span *ngIf="deleting" class="flex items-center gap-2">
          <svg class="w-5 h-5 animate-spin" fill="none" viewBox="0 0 24 24">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          Suppression...
        </span>
      </button>
    </div>
  </div>
</div>
