<!-- chart.component.html -->
<div class="bg-gray-50 dark:bg-[#1d1d1d] p-4 sm:p-6 rounded-2xl transition-all duration-300">
  <!-- En-tête -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 sm:gap-4 mb-4 sm:mb-8">
    <div>
      <h2 class="text-xl sm:text-2xl text-gray-900 dark:text-white tracking-tight">
        Analyse des ventes
      </h2>
      <p class="text-gray-500 dark:text-white/30 text-xs sm:text-sm font-light mt-0.5 sm:mt-1 tracking-wide">
        Évolution mensuelle comparative
      </p>
    </div>
    <div class="flex items-center gap-2 sm:gap-4">
      <div class="flex items-center gap-2 bg-yellow-500/10 dark:bg-yellow-500/10 px-2 sm:px-3 py-1 sm:py-1.5 rounded-full">
        <span class="w-1.5 sm:w-2 h-1.5 sm:h-2 rounded-full bg-yellow-500"></span>
        <span class="text-yellow-600 dark:text-yellow-500/80 text-[10px] sm:text-xs font-medium tracking-wide">2024</span>
        <span class="w-1.5 sm:w-2 h-1.5 sm:h-2 rounded-full bg-yellow-500/50 ml-2 sm:ml-3"></span>
        <span class="text-yellow-600/50 dark:text-yellow-500/50 text-[10px] sm:text-xs font-medium tracking-wide">2023</span>
      </div>
    </div>
  </div>

  <!-- Graphique avec défilement horizontal sur mobile -->
  <div class="relative w-full overflow-x-auto overflow-y-hidden sm:overflow-visible pb-2 sm:pb-0">
    <div class="w-full sm:w-full min-w-[600px] sm:min-w-0 h-[250px] sm:h-[300px] md:h-[350px] lg:h-[380px]">
      <canvas #salesChart class="w-full h-full"></canvas>
    </div>
    <!-- Indicateur de défilement sur mobile -->
    <div class="sm:hidden flex justify-center items-center gap-1 mt-2 text-yellow-600/40 dark:text-yellow-500/40 text-xs">
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
      <span>Faites glisser pour voir tous les mois</span>
      <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
      </svg>
    </div>
  </div>

  <!-- Statistiques rapides -->
  <div class="grid grid-cols-2 sm:grid-cols-2 md:grid-cols-4 gap-2 sm:gap-3 md:gap-4 mt-4 sm:mt-6 pt-4 sm:pt-6 border-t border-gray-200 dark:border-white/5">
    <div class="bg-gray-100 dark:bg-[#2a2a2a] rounded-xl p-2 sm:p-3 transition-all duration-300">
      <p class="text-gray-500 dark:text-yellow-500/60 text-[10px] sm:text-xs font-light tracking-wide">Total 2024</p>
      <p class="text-yellow-600 dark:text-yellow-500 text-sm sm:text-base md:text-lg font-medium">298 000 $</p>
    </div>
    <div class="bg-gray-100 dark:bg-[#2a2a2a] rounded-xl p-2 sm:p-3 transition-all duration-300">
      <p class="text-gray-500 dark:text-yellow-500/60 text-[10px] sm:text-xs font-light tracking-wide">Total 2023</p>
      <p class="text-yellow-600 dark:text-yellow-500 text-sm sm:text-base md:text-lg font-medium">218 000 $</p>
    </div>
    <div class="bg-gray-100 dark:bg-[#2a2a2a] rounded-xl p-2 sm:p-3 transition-all duration-300">
      <p class="text-gray-500 dark:text-yellow-500/60 text-[10px] sm:text-xs font-light tracking-wide">Croissance</p>
      <p class="text-green-600 dark:text-green-400 text-sm sm:text-base md:text-lg font-medium">+36.7%</p>
    </div>
    <div class="bg-gray-100 dark:bg-[#2a2a2a] rounded-xl p-2 sm:p-3 transition-all duration-300">
      <p class="text-gray-500 dark:text-yellow-500/60 text-[10px] sm:text-xs font-light tracking-wide">Meilleur mois</p>
      <p class="text-yellow-600 dark:text-yellow-500 text-sm sm:text-base md:text-lg font-medium">Décembre</p>
    </div>
  </div>
</div>
