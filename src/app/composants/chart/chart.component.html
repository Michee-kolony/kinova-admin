<div class="bg-[#1d1d1d] p-6 rounded-2xl">
  <!-- En-tête -->
  <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-8">
    <div>
      <h2 class="text-2xl  text-white tracking-tight">
        Analyse des ventes
      </h2>
      <p class="text-white/60 text-sm font-light mt-1 tracking-wide">
        Évolution mensuelle comparative
      </p>
    </div>
    <div class="flex items-center gap-4">
      <div class="flex items-center gap-2 bg-white/10 px-3 py-1.5 rounded-full">
        <span class="w-2 h-2 rounded-full bg-white"></span>
        <span class="text-white text-xs font-medium tracking-wide">2024</span>
        <span class="w-2 h-2 rounded-full bg-white/50 ml-3"></span>
        <span class="text-white/60 text-xs font-medium tracking-wide">2023</span>
      </div>
    </div>
  </div>

  <!-- Graphique -->
  <div class="relative w-full h-[380px]">
    <canvas #salesChart class="w-full h-full"></canvas>
  </div>

  <!-- Statistiques rapides -->
  <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mt-6 pt-6">
    <div class="bg-[#2a2a2a] rounded-xl p-3 ">
      <p class="text-yellow-500 text-xs font-light tracking-wide">Total 2024</p>
      <p class="text-yellow-500 text-lg font-medium">298 000 $</p>
    </div>
    <div class="bg-[#2a2a2a] rounded-xl p-3 ">
      <p class="text-yellow-500 text-xs font-light tracking-wide">Total 2023</p>
      <p class="text-yellow-500 text-lg font-medium">218 000 $</p>
    </div>
    <div class="bg-[#2a2a2a] rounded-xl p-3 ">
      <p class="text-yellow-500 text-xs font-light tracking-wide">Croissance</p>
      <p class="text-yellow-500 text-lg font-medium">+36.7%</p>
    </div>
    <div class="bg-[#2a2a2a] rounded-xl p-3 ">
      <p class="text-yellow-500 text-xs font-light tracking-wide">Meilleur mois</p>
      <p class="text-yellow-500 text-lg font-medium">Décembre</p>
    </div>
  </div>
</div>
