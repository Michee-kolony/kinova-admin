<div class="min-h-screen   p-6">

  <!-- FORMULAIRE EN HAUT -->
  <div class="shadow-md rounded-xl p-4 mb-6 bg-white/80 dark:bg-[#171515]">

    <h2 class="text-xl font-bold  mb-4">
      Ajouter une catégorie
    </h2>

    <form class="flex flex-col md:flex-row gap-4 items-end">

      <!-- Nom -->
      <div class="w-full">
        <label class="block text-sm  mb-1">Nom</label>
        <input
          type="text"
          name="nom"
          [(ngModel)]="categorie.nom"
          placeholder="Ex: Informatique"
          class="w-full px-4 py-2.5 bg-gray-100 dark:bg-gray-600 rounded-lg  outline-none"
        />
      </div>

      <!-- Hashtag -->
      <div class="w-full">
        <label class="block text-sm  mb-1">Hashtag</label>
        <input
          type="text"
          name="htag"
          [(ngModel)]="categorie.htag"
          placeholder="Ex: #tech"
          class="w-full px-4 py-2.5 bg-gray-100 dark:bg-gray-600  rounded-lg  outline-none"
        />
      </div>

      <!-- Bouton -->
      <button
        type="button"
        [disabled]="!categorie.nom && !categorie.htag"
         [ngClass]="{ 'bg-gray-400': !categorie.nom || !categorie.htag }"
        (click)="ajouterCategorie()"
        class="bg-[#ffbf00] text-white px-6 py-2.5 rounded-lg shadow-md transition"
      >
        <span *ngIf="loadingCreate"
            class="w-5 h-5  border-t-transparent rounded-full animate-spin"></span>
            
      {{ loadingCreate ? 'Création...' : 'Créer' }}

      </button>

    </form>


    
  </div>

    <!-- État de chargement -->
  <div *ngIf="loading" class="loading-container">
    <div class="loading-spinner"></div>
    <p class="loading-text">Chargement des catégories <i class="fas fa-spinner fa-spin text-xl text-[#ffbf00]"></i></p>
  </div>

  <!-- LISTE DES CATÉGORIES -->
<div class="rounded-xl p-4">
  <h2 class="text-xl font-bold mb-4">
    Liste des catégories
  </h2>

  <div *ngIf="categories.length === 0" class="text-gray-500 text-center py-8">
    <i class="fas fa-inbox text-4xl mb-2 block mx-auto"></i>
    Aucune catégorie ajoutée
  </div>

<!-- Cartes horizontales -->
<div class="space-y-3">
  <div
    *ngFor="let cat of categories"
    class="flex flex-col sm:flex-row items-start sm:items-center justify-between p-4 bg-white/80 dark:bg-[#171515] rounded-lg shadow-md hover:shadow-lg transition-all duration-300 gap-3 sm:gap-4"
  >
    <!-- Informations de la catégorie -->
    <div class="flex items-center space-x-3 sm:space-x-4 flex-1 w-full sm:w-auto">
      <!-- Icône -->
      <div 
        class="w-10 h-10 sm:w-12 sm:h-12 rounded-full flex items-center justify-center text-white text-sm sm:text-base font-bold flex-shrink-0"
        [style.background-color]="cat.color || '#ffbf00'">
        <i *ngIf="cat.icon" [class]="'fas ' + cat.icon"></i>
        <span *ngIf="!cat.icon">{{ (cat.nom || 'C')[0] | uppercase }}</span>
      </div>

      <!-- Détails -->
      <div class="flex-1 min-w-0">
        <div class="flex flex-wrap items-center gap-1.5 sm:gap-2">
          <h3 class="font-bold text-gray-800 dark:text-white text-sm sm:text-base truncate max-w-[120px] sm:max-w-none">
            {{ cat.nom }}
          </h3>
          <span 
            class="px-2 py-0.5 text-[10px] sm:text-xs rounded-full whitespace-nowrap"
            [style.background-color]="cat.color || '#ffbf00'"
            [style.color]="'white'">
            {{ cat.htag || 'H1' }}
          </span>
        </div>
        <p *ngIf="cat.description" class="text-xs sm:text-sm text-gray-500 dark:text-gray-400 mt-0.5 truncate">
          {{ cat.description }}
        </p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center space-x-2 w-full sm:w-auto justify-end sm:justify-start">
      <!-- Bouton Supprimer -->
      <button
        (click)="supprimerCategorie(cat._id)"
        class="px-2.5 sm:px-3 py-1.5 rounded-lg bg-red-500 text-white hover:bg-red-600 transition-colors flex items-center space-x-1">
        <i class="fas fa-trash-alt text-[10px] sm:text-xs"></i>
        <span class="text-[10px] sm:text-xs font-medium hidden sm:inline">Supprimer</span>
      </button>
    </div>
  </div>
</div>



</div>

</div>
